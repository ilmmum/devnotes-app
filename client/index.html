<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevNotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>DevNotes</h1>
    <p class="subtitle">A tiny notes app for DevOps practice</p>
    
    <form id="note-form">
      <input type="text" id="title" placeholder="Note title" required>
      <textarea id="content" placeholder="Write something..." required></textarea>
      <button type="submit">Add Note</button>
    </form>

    <p id="note-count"></p>
    <div id="notes-list"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
